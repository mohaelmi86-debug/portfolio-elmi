name: Validate portfolio
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: node --check app.js
      - name: Validate XML content files
        run: |
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          files = [
              "data/profile.xml",
              "data/projects.xml",
              "data/skills.xml",
              "data/journey.xml",\n              "data/formations.xml",
          ]
          for filename in files:
              root = ET.parse(Path(filename)).getroot()
              print(f"Valid XML: {filename} ({root.tag})")
          projects = ET.parse("data/projects.xml").getroot().findall("project")
          assert len(projects) >= 1, "No project found in projects.xml"
          print(f"Project records: {len(projects)}")
          PY
